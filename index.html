<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b4965">
<title>Empower Compass has moved</title>
<link rel="canonical" href="https://motbuchanan.github.io/empower-compass/">
<meta http-equiv="refresh" content="1; url=https://motbuchanan.github.io/empower-compass/">
<style>
  html,body{height:100%;margin:0}
  body{
    background:linear-gradient(155deg,#226079 0%,#1b4965 55%,#143a4f 100%);
    color:#eef6fa;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;box-sizing:border-box
  }
  svg{width:64px;height:64px;margin-bottom:18px}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:24px;margin:0 0 8px}
  p{font-size:15px;line-height:1.6;opacity:.9;margin:0 0 20px;max-width:340px}
  a.go{
    display:inline-block;background:#2fbde8;color:#0e2a38;font-weight:700;
    text-decoration:none;padding:14px 26px;border-radius:26px;font-size:16px
  }
  .small{margin-top:18px;font-size:12px;opacity:.65}
</style>
</head>
<body>
  <svg viewBox="0 0 40 40" aria-hidden="true">
    <defs>
      <mask id="cresA"><rect width="40" height="40" fill="#fff"/><circle cx="27" cy="15" r="15" fill="#000"/></mask>
      <mask id="cresB"><rect width="40" height="40" fill="#fff"/><circle cx="26" cy="16" r="10.5" fill="#000"/></mask>
    </defs>
    <circle cx="20" cy="20" r="17" fill="#7fd6f2" mask="url(#cresA)"/>
    <circle cx="21" cy="19" r="12.5" fill="#2fbde8" mask="url(#cresB)"/>
  </svg>
  <h1>Empower Compass has a new home</h1>
  <p>Taking you there now. If nothing happens, tap the button below and update your bookmark.</p>
  <a class="go" id="go" href="https://motbuchanan.github.io/empower-compass/">Open Empower Compass</a>
  <div class="small">motbuchanan.github.io/empower-compass</div>
<script>
  // Belt-and-suspenders: redirect via JS too (covers browsers that ignore meta-refresh),
  // using replace() so the old URL doesn't linger in history/back button.
  setTimeout(function(){
    try { window.location.replace('https://motbuchanan.github.io/empower-compass/'); }
    catch(e){ window.location.href = 'https://motbuchanan.github.io/empower-compass/'; }
  }, 900);
</script>
</body>
</html>
